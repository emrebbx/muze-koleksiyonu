<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Müze Koleksiyonu</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="oyunEkrani">

    <!-- =========================
         AÇILIŞ EKRANI
    ========================== -->

    <div id="acilisEkrani" class="ekran aktif">

      <img
        id="euLogo"
        src="images/eu-games-logo.png"
        alt="EU Games"
      >

      <img
        id="devamButonu"
        src="images/devam-etmek-icin-dokun.png"
        alt="Devam etmek için dokun"
      >

    </div>


    <!-- =========================
         ANA MENÜ
    ========================== -->

    <div id="anaMenu" class="ekran">

      <img
        id="anaMenuArkaplan"
        src="images/ana-menu-arkaplan.webp"
        alt=""
      >

      <img
        id="muzeLogo"
        src="images/muze-koleksiyonu-logo.png"
        alt="Müze Koleksiyonu"
      >

      <img
        id="baslaButonu"
        src="images/basla.png"
        alt="Başla"
      >

      <img
        id="nasilOynanirButonu"
        src="images/nasil-oynanir.png"
        alt="Nasıl Oynanır"
      >

      <img
        id="altEuLogo"
        src="images/eu-games-logo.png"
        alt="EU Games"
      >

    </div>


    <!-- =========================
         OYNANIŞ EKRANI
    ========================== -->

    <div id="oynanisEkrani" class="ekran">

      <!-- ARKA PLAN -->

      <img
        id="oyunArkaplan"
        src="images/oyun-arkaplan.png"
        alt=""
      >


      <!-- 2. OYUNCU BORDO SANATÇI YUVALARI -->

      <img
        src="images/sanatci-yuva.png"
        class="sanatciYuva bordo1"
        alt=""
      >

      <img
        src="images/sanatci-yuva.png"
        class="sanatciYuva bordo2"
        alt=""
      >

      <img
        src="images/sanatci-yuva.png"
        class="sanatciYuva bordo3"
        alt=""
      >


      <!-- 1. OYUNCU LACİVERT SANATÇI YUVALARI -->

      <img
        src="images/sanatci-yuva-lacivert.png"
        class="sanatciYuva lacivert1"
        alt=""
      >

      <img
        src="images/sanatci-yuva-lacivert.png"
        class="sanatciYuva lacivert2"
        alt=""
      >

      <img
        src="images/sanatci-yuva-lacivert.png"
        class="sanatciYuva lacivert3"
        alt=""
      >


      <!-- =========================
           SANATÇI SEÇİM ALANI
      ========================== -->

      <div id="sanatciSecimAlani">

        <div id="karistirmaDestesi"></div>

        <div id="kapaliKartSirasi"></div>

      </div>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
