<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Müze Koleksiyonu</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="oyunEkrani">

    <!-- AÇILIŞ EKRANI -->
    <div id="acilisEkrani" class="ekran aktif">

      <img
        id="euLogo"
        src="images/eu-games-logo.png"
        alt="EU Games"
      >

      <img
        id="devamButonu"
        src="images/devam-etmek-icin-dokun.png"
        alt="Devam etmek için dokun"
      >

    </div>

    <!-- ANA MENÜ -->
    <div id="anaMenu" class="ekran">

      <img
        id="anaMenuArkaplan"
        src="images/ana-menu-arkaplan.png"
        alt=""
      >

      <img
        id="muzeLogo"
        src="images/muze-koleksiyonu-logo.png"
        alt="Müze Koleksiyonu"
      >

      <img
        id="baslaButonu"
        src="images/basla.png"
        alt="Başla"
      >

      <img
        id="nasilOynanirButonu"
        src="images/nasil-oynanir.png"
        alt="Nasıl Oynanır"
      >

      <img
        id="altEuLogo"
        src="images/eu-games-logo.png"
        alt="EU Games"
      >

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
