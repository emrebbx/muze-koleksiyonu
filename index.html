<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Müze Koleksiyonu</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="oyunEkrani">

    <!-- =========================
         AÇILIŞ EKRANI
    ========================== -->

    <div id="acilisEkrani" class="ekran aktif">

      <div id="acilisIcerik">

        <img
          id="euLogo"
          src="images/eu-games-logo.png"
          alt="EU Games"
        >

        <img
          id="devamButonu"
          src="images/devam-etmek-icin-dokun.png"
          alt="Devam etmek için dokun"
        >

      </div>

    </div>


    <!-- =========================
         ANA MENÜ
    ========================== -->

    <div id="anaMenu" class="ekran">

      <img
        id="anaMenuArkaplan"
        src="images/ana-menu-arkaplan.webp"
        alt=""
      >

      <img
        id="muzeLogo"
        src="images/muze-koleksiyonu-logo.png"
        alt="Müze Koleksiyonu"
      >

      <img
        id="baslaButonu"
        src="images/basla.png"
        alt="Başla"
      >

      <img
        id="nasilOynanirButonu"
        src="images/nasil-oynanir.png"
        alt="Nasıl Oynanır"
      >

      <img
        id="altEuLogo"
        src="images/eu-games-logo.png"
        alt="EU Games"
      >

    </div>


    <!-- =========================
         OYNANIŞ EKRANI
    ========================== -->

    <div id="oynanisEkrani" class="ekran">

      <img
        id="oyunArkaplan"
        src="images/oyun-arkaplan.png"
        alt=""
      >


      <!-- 2. OYUNCU - ÜST -->

      <div id="oyuncu2SanatciYuvalari">

        <img src="images/sanatci-1.png"
             class="yeniSanatciYuva ustSanatci1"
             alt="Sanatçı 1">

        <img src="images/sanatci-2.png"
             class="yeniSanatciYuva ustSanatci2"
             alt="Sanatçı 2">

        <img src="images/sanatci-3.png"
             class="yeniSanatciYuva ustSanatci3"
             alt="Sanatçı 3">

      </div>


      <!-- 1. OYUNCU - ALT -->

      <div id="oyuncu1SanatciYuvalari">

        <img src="images/sanatci-1.png"
             class="yeniSanatciYuva altSanatci1"
             alt="Sanatçı 1">

        <img src="images/sanatci-2.png"
             class="yeniSanatciYuva altSanatci2"
             alt="Sanatçı 2">

        <img src="images/sanatci-3.png"
             class="yeniSanatciYuva altSanatci3"
             alt="Sanatçı 3">

      </div>


      <img
        id="artanOzelYuvasi"
        src="images/artan-ozel-yuva.png"
        alt="Artan Özel Kartlar"
      >

      <img
        id="artanSanatciYuvasi"
        src="images/artan-sanatci-yuva.png"
        alt="Artan Sanatçı Kartları"
      >


      <div id="sanatciSecimAlani">
        <div id="karistirmaDestesi"></div>
        <div id="kapaliKartSirasi"></div>
      </div>


      <div id="ozelKartSecimAlani">

        <div id="ozelKartBaslik">
          ÖZEL KART SEÇİMİ
        </div>

        <div id="ozelKartAciklama">
          20 özel kart arasından 12 adet özel kart seç.<br>
          Dedektif Soruşturması kartıyla başla.
          Bu kartın seçilmesi zorunludur.
        </div>

        <div id="ozelKartSayac">
          SEÇİLEN ÖZEL KART: 0 / 12
        </div>

        <div id="dedektifSecimAlani"></div>

        <div id="ozelKartSecimSirasi"></div>

      </div>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <script src="script.js"></script>

</body>
</html>
